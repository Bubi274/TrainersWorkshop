# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod info
mod_version=3.0.0
maven_group=io.github.bubi274.trainersworkshop
archives_base_name=trainers_workshop

# Versions must match the COBBLEVERSE 1.8.0 modpack
minecraft_version=1.21.1
# Yarn: Minecraft class/method names used in the code (can be checked without downloading Minecraft)
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
# Loom 1.11.8 loads kotlin-metadata-jvm for the project's Kotlin version at build time, so it works with Kotlin 2.4.
loom_version=1.11.8
fabric_version=0.116.18+1.21.1
cobblemon_version=1.8.4+1.21.1

# Kotlin: must match the Fabric Language Kotlin version in COBBLEVERSE 1.8.0
kotlin_version=2.4.21
fabric_kotlin_version=1.14.2+kotlin.2.4.21

# Radical Cobblemon Trainers (Modrinth version IDs)
# rctmod-fabric-1.21.1-0.19.2-beta, rctapi-fabric-1.21.1-0.16.2-beta
rctmod_version=rgfBfnW9
rctapi_version=DoQNDXAU
