name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read the mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build (also runs the unit tests)
        run: ./gradlew build --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: trainers_workshop-${{ steps.version.outputs.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 30

  release:
    # Pushing a tag like v2.1.0 creates a GitHub Release with the jar attached.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built jar
        uses: actions/download-artifact@v4
        with:
          pattern: trainers_workshop-*
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
