plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Official Cobblemon maven
    maven {
        name = 'Cobblemon'
        url = 'https://maven.impactdev.net/repository/development/'
    }
    // Modrinth maven: only used for Radical Cobblemon Trainers (rctmod, rctapi)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"

    // Radical Cobblemon Trainers: optional, only needed at compile time (not bundled into the mod).
    // Versions match the COBBLEVERSE 1.8.0 modpack: rctmod 0.19.2-beta, rctapi 0.16.2-beta.
    modCompileOnly "maven.modrinth:rctmod:${project.rctmod_version}"
    modCompileOnly "maven.modrinth:rctapi:${project.rctapi_version}"

    // Plain unit tests (no Minecraft needed), for example LevelRules.
    testImplementation 'junit:junit:4.13.2'

    // Other optional dependencies are not needed to compile:
    // - Cobblemon Raid Dens: only its loot table ID is used.
    // - TMCraft, Only Bottle Caps: items are only looked up by ID in the registry.
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain 21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

test {
    useJUnit()
}
