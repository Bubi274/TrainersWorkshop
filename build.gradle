plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Maven chính thức của Cobblemon
    maven {
        name = 'Cobblemon'
        url = 'https://maven.impactdev.net/repository/development/'
    }
    // Modrinth maven: chỉ dùng cho Radical Cobblemon Trainers (rctmod, rctapi)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"

    // Radical Cobblemon Trainers: tuỳ chọn, chỉ cần lúc biên dịch (không đóng gói vào mod).
    // Phiên bản khớp modpack Cobbleverse: rctmod 0.18.1-beta, rctapi 0.15.2-beta.
    modCompileOnly "maven.modrinth:rctmod:${project.rctmod_version}"
    modCompileOnly "maven.modrinth:rctapi:${project.rctapi_version}"

    // Unit test thuần (không cần Minecraft), ví dụ LevelRules.
    testImplementation 'junit:junit:4.13.2'

    // Các phụ thuộc tuỳ chọn khác không cần để biên dịch:
    // - Cobblemon Raid Dens: chỉ dùng ID bảng loot.
    // - TMCraft, Only Bottle Caps: chỉ tra vật phẩm theo ID trong registry.
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
    jvmToolchain 21
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

test {
    useJUnit()
}
